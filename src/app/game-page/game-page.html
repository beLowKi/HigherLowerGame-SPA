<div class="container-fluid">
    <div class="panel-container" #panelContainer>
        @for (app of this.activeApps(); track app) {
            @let isFirst = $index === 0;
            <app-game-panel #panelRef
                class="game-panel-slot"
                [app]="app"
                [initRevealed]="isFirst"
                
                (buttonSelected)="onPanelButtonSelected($event)"
                >
                Loading...
            </app-game-panel>
        } @empty {
            <div class="d-flex h-100 w-100 justify-content-center align-items-center">
                <h1>Could not load any games. Try again later.</h1>
            </div>
        }
    </div>
</div>
