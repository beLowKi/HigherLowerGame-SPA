@let game1 = game.game1() || null;
@let game2 = game.game2() || null;

<div class="row g-0 mx-0 px-0" style="height: 100%">
    <div class="col">
        @if (game1) {
            <app-game-panel [app]=game1 [revealed]=true></app-game-panel>
        } @else {
            <div class="d-flex vh-100 text-center justify-content-center  align-items-center">
                <!-- TODO loading gif -->
                <p>Loading...</p>
            </div>
        }
    </div>
    <div class="col">
        @if (game2) {
            <app-game-panel [app]=game2 [revealed]=false></app-game-panel>
        } @else {
            <div class="d-flex vh-100 text-center justify-content-center align-items-center">
                <!-- TODO loading gif -->
                <p>Loading...</p>
            </div>
        }
    </div>
</div>
