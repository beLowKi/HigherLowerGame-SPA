<div class="home-page">
    <div class="home-page-item-container">
        <div class="row home-page-text-container">
            <h1 class="display-1 w-100 text-center">{{this.appName}}</h1>
            <h3 class="display-5 w-100 text-center">{{this.appDescription}}</h3>
        </div>
        <div class="row home-page-button-container">
            <button class="home-page-button w-50" (click)="startNewGame()">Start Game</button>
        </div>
    </div>
</div>
